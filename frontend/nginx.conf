server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Include MIME types mapping and fallback default
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Ensure correct JavaScript MIME type for ES modules (.js, .mjs)
    location ~* \.(?:js|mjs)$ {
        types {
            application/javascript js mjs;
        }
        default_type application/javascript;
        add_header Cache-Control "public, immutable";
        expires 1y;
    }

    # Ensure correct CSS MIME type (.css)
    location ~* \.css$ {
        types {
            text/css css;
        }
        default_type text/css;
        add_header Cache-Control "public, immutable";
        expires 1y;
    }

    # Frontend Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to backend Kubernetes service
    location /api/ {
        proxy_pass http://backend-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy health & readiness probes
    location /health {
        proxy_pass http://backend-service:8000/health;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://backend-service:8000/ready;
        proxy_set_header Host $host;
    }

    # Reverse proxy Prometheus metrics
    location /metrics {
        proxy_pass http://backend-service:8000/metrics;
        proxy_set_header Host $host;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
