version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctor-appointment-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./appointments.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
