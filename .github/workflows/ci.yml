name: Build, Test, Security & GHCR Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*', 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: write

jobs:
  test:
    name: Unit & Integration Tests (Ruff, Pytest, Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies & Linter
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff

      - name: Run Ruff Static Checks
        run: |
          ruff check backend

      - name: Run Automated API Tests (Concurrency, RBAC & Health)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Single Page Application
        run: |
          cd frontend
          npm ci
          npm run build

  security-scan:
    name: Trivy Vulnerability & Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # 1. Repository Filesystem & Dependency CVE Scan
      - name: Trivy Filesystem Scan (Dependencies & Secrets)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # 2. Build & Scan Backend Image
      - name: Build Backend Docker Image for Scan
        run: |
          docker build -t hospital-backend:ci ./backend

      - name: Trivy Container Scan (Backend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hospital-backend:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # 3. Build & Scan Frontend Image
      - name: Build Frontend Docker Image for Scan
        run: |
          docker build -t hospital-frontend:ci ./frontend

      - name: Trivy Container Scan (Frontend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hospital-frontend:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # 4. Build & Scan Worker Image
      - name: Build Worker Docker Image for Scan
        run: |
          docker build -f ./backend/Dockerfile.worker -t hospital-worker:ci ./backend

      - name: Trivy Container Scan (Worker Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hospital-worker:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  publish-ghcr:
    name: Build & Publish Immutable Images to GHCR
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Version & Commit Tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="latest"
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "OWNER=${OWNER}" >> $GITHUB_ENV

      # 1. Publish Frontend Image
      - name: Build & Push Frontend Image
        run: |
          IMAGE_NAME="ghcr.io/${OWNER}/hospital-frontend"
          docker build -t ${IMAGE_NAME}:${VERSION} -t ${IMAGE_NAME}:sha-${SHORT_SHA} ./frontend
          docker push ${IMAGE_NAME}:${VERSION}
          docker push ${IMAGE_NAME}:sha-${SHORT_SHA}
          echo "FE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${IMAGE_NAME}:${VERSION} 2>/dev/null || echo '')" >> $GITHUB_ENV

      # 2. Publish Backend Image
      - name: Build & Push Backend Image
        run: |
          IMAGE_NAME="ghcr.io/${OWNER}/hospital-backend"
          docker build -t ${IMAGE_NAME}:${VERSION} -t ${IMAGE_NAME}:sha-${SHORT_SHA} ./backend
          docker push ${IMAGE_NAME}:${VERSION}
          docker push ${IMAGE_NAME}:sha-${SHORT_SHA}
          echo "BE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${IMAGE_NAME}:${VERSION} 2>/dev/null || echo '')" >> $GITHUB_ENV

      # 3. Publish Worker Image
      - name: Build & Push Worker Image
        run: |
          IMAGE_NAME="ghcr.io/${OWNER}/hospital-worker"
          docker build -f ./backend/Dockerfile.worker -t ${IMAGE_NAME}:${VERSION} -t ${IMAGE_NAME}:sha-${SHORT_SHA} ./backend
          docker push ${IMAGE_NAME}:${VERSION}
          docker push ${IMAGE_NAME}:sha-${SHORT_SHA}
          echo "WK_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${IMAGE_NAME}:${VERSION} 2>/dev/null || echo '')" >> $GITHUB_ENV

      # 4. Generate GitHub Step Summary
      - name: Generate Artifact Summary
        run: |
          echo "### 📦 GHCR Immutable Artifacts Published" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Version Tag | Commit Tag | Registry URL | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend** | \`${VERSION}\` | \`sha-${SHORT_SHA}\` | \`ghcr.io/${OWNER}/hospital-frontend:${VERSION}\` | \`${FE_DIGEST}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend** | \`${VERSION}\` | \`sha-${SHORT_SHA}\` | \`ghcr.io/${OWNER}/hospital-backend:${VERSION}\` | \`${BE_DIGEST}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Worker** | \`${VERSION}\` | \`sha-${SHORT_SHA}\` | \`ghcr.io/${OWNER}/hospital-worker:${VERSION}\` | \`${WK_DIGEST}\` |" >> $GITHUB_STEP_SUMMARY

  deploy-aks:
    name: Deploy & Verify AKS Workloads
    runs-on: ubuntu-latest
    needs: publish-ghcr
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Release Images in Kustomize
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "Overriding Kustomize deployment images with release version: ${VERSION}"
          {
            echo ""
            echo "images:"
            echo "  - name: ghcr.io/sumit4h9/hospital-backend"
            echo "    newName: ghcr.io/${OWNER}/hospital-backend"
            echo "    newTag: ${VERSION}"
            echo "  - name: ghcr.io/sumit4h9/hospital-frontend"
            echo "    newName: ghcr.io/${OWNER}/hospital-frontend"
            echo "    newTag: ${VERSION}"
            echo "  - name: ghcr.io/sumit4h9/hospital-worker"
            echo "    newName: ghcr.io/${OWNER}/hospital-worker"
            echo "    newTag: ${VERSION}"
          } >> k8s/kustomization.yaml
          echo "--- Rendered Kustomize Release Manifests ---"
          kubectl kustomize k8s/ | grep -E "image: ghcr.io"

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: 'hospital-prod-rg'
          cluster-name: 'hospital-aks'

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -k k8s/

      - name: Verify Backend Rollout
        run: |
          kubectl rollout status deployment/backend-deployment -n healthcare --timeout=180s

      - name: Verify Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend-deployment -n healthcare --timeout=180s

      - name: Verify Worker Rollout
        run: |
          kubectl rollout status deployment/worker-deployment -n healthcare --timeout=180s

      - name: Verify Live Cluster Workloads
        run: |
          kubectl get pods -n healthcare
          kubectl get deployments -n healthcare

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag || echo "GitHub Release already exists or creation skipped."


