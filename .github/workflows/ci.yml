name: Build, Test & Security CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Automated API Tests (Concurrency, RBAC & Health)
        run: |
          pytest backend/tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  security-scan:
    name: Trivy Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # 1. Repository Filesystem Scan (Dependencies & Misconfigurations)
      - name: Trivy Filesystem Scan (Dependencies & Configs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # 2. Build Backend Docker Image for Scan
      - name: Build Backend Docker Image
        run: |
          docker build -t doctor-appointment-backend:ci ./backend

      - name: Trivy Container Scan (Backend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'doctor-appointment-backend:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # 3. Build Frontend Docker Image for Scan
      - name: Build Frontend Docker Image
        run: |
          docker build -t doctor-appointment-frontend:ci ./frontend

      - name: Trivy Container Scan (Frontend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'doctor-appointment-frontend:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
